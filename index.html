<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Common Weights catalog</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cstyle%3E.i{stroke:%23141413}.t0{fill:%235FD98C}.t1{fill:%2322B35A}.t2{fill:%2315863F}.t3{fill:%230F5A2A}@media (prefers-color-scheme: dark){.i{stroke:%23F2F0E8}.t0{fill:%2314532D}.t1{fill:%2315803D}.t2{fill:%2322C55E}.t3{fill:%234ADE80}}%3C/style%3E%3Cpath class='i' d='M14 12H7V88H14M86 12H93V88H86' fill='none' stroke-width='5' stroke-linejoin='round'/%3E%3Crect x='20' y='20' width='16' height='16' rx='3' class='t0'/%3E%3Crect x='42' y='20' width='16' height='16' rx='3' class='t2'/%3E%3Crect x='64' y='20' width='16' height='16' rx='3' class='t1'/%3E%3Crect x='20' y='42' width='16' height='16' rx='3' class='t2'/%3E%3Crect x='42' y='42' width='16' height='16' rx='3' class='t3'/%3E%3Crect x='64' y='42' width='16' height='16' rx='3' class='t0'/%3E%3Crect x='20' y='64' width='16' height='16' rx='3' class='t1'/%3E%3Crect x='42' y='64' width='16' height='16' rx='3' class='t0'/%3E%3Crect x='64' y='64' width='16' height='16' rx='3' class='t2'/%3E%3C/svg%3E">
<style>
  :root { --bg:#fafaf7; --fg:#1b1b1b; --muted:#6b6b6b; --card:#fff; --line:#e4e2dc; --ok:#1f7a3a; --warn:#9a6700; --bad:#a12; --accent:#2d5be3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151515; --fg:#ececec; --muted:#a0a0a0; --card:#1e1e1e; --line:#333; --ok:#5ccb7a; --warn:#e2b340; --bad:#f07070; --accent:#7ea0ff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:22px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 16px; }
  input { width:100%; box-sizing:border-box; padding:10px 12px; font-size:15px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:12px 0; }
  .name { font-weight:600; font-size:16px; } .meta { color:var(--muted); font-size:13px; margin-top:2px; word-break:break-all; }
  .badges { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
  .b { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .b.publisher, .b.index { border-color:var(--ok); color:var(--ok); } .b.mirror { border-color:var(--warn); color:var(--warn); } .b.scan { border-color:var(--accent); color:var(--accent); }
  .b.seed { border-color:var(--ok); color:var(--ok); } .b.noseed { border-color:var(--bad); color:var(--bad); }
  .b.ref { border-color:var(--accent); color:var(--accent); font-weight:600; } .card.old { opacity:.75; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  .links { margin-top:8px; font-size:13px; display:flex; gap:12px; flex-wrap:wrap; }
  .empty { color:var(--muted); padding:24px 0; }
  code { font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>Common Weights</h1>
  <p class="sub" id="node">Loading catalog…</p>
  <input id="q" placeholder="Search models (name, license, issuer)" autofocus>
  <div id="list"></div>
</main>
<script>
(async () => {
  const fmt = n => { const u=['B','KB','MB','GB','TB']; let i=0; while(n>=1000&&i<u.length-1){n/=1000;i++} return (i?n.toFixed(1):n)+' '+u[i]; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let idx;
  try { idx = await (await fetch('index.json', {cache:'no-store'})).json(); }
  catch (e) { document.getElementById('node').textContent = 'Could not load index.json: ' + e; return; }
  const live = !!idx.node, denylists = idx.denylists || [];
  for (const m of idx.models) { m.seeds = m.seeds || []; m.attestations = m.attestations || []; }
  const node = live ? `${esc(idx.node.name)} · commonweights ${esc(idx.node.version)}` : 'static catalog';
  const names = new Set(idx.models.map(m => m.name)).size;
  // Current revisions (those a ref points to) first, then older snapshots of the same model.
  idx.models.sort((a, b) => a.name.localeCompare(b.name) || (b.refs||[]).length - (a.refs||[]).length);
  document.getElementById('node').innerHTML = `${node} · ${names} model${names===1?'':'s'}, ${idx.models.length} revision${idx.models.length===1?'':'s'}` + (idx.generated ? ` · generated ${esc(idx.generated)}` : '') + (denylists.length ? ` · ${denylists.length} denylist${denylists.length===1?'':'s'} published` : '');
  const list = document.getElementById('list');
  const render = q => {
    q = q.trim().toLowerCase();
    const rows = idx.models.filter(m => !q || [m.name, m.license||'', ...m.attestations.map(a=>a.issuer+' '+a.kind)].join(' ').toLowerCase().includes(q));
    if (!rows.length) { list.innerHTML = '<div class="empty">No models match.</div>'; return; }
    list.innerHTML = rows.map(m => {
      const att = m.attestations.map(a => `<span class="b ${esc(a.kind)}" title="${esc(a.claim)} · ${esc(a.key)}">${esc(a.kind)}: ${esc(a.issuer)}</span>`).join('');
      // A static catalog lists no seeds: peers are found through the DHT, so saying "none" would mislead.
      const seed = m.seeds.length ? `<span class="b seed">${m.seeds.length} seed${m.seeds.length===1?'':'s'}</span>` : live ? '<span class="b noseed">no seeds listed</span>' : '';
      const magnet = `magnet:?xt=urn:${m.root}&dn=${encodeURIComponent(m.name)}` + m.seeds.map(s=>'&ws='+encodeURIComponent(s)).join('');
      const refs = (m.refs||[]).map(r => `<span class="b ref">${esc(r)}</span>`).join('');
      const pull = (m.refs||[]).includes('main') ? `cw pull ${esc(m.name)}` : `cw pull ${esc(m.name)} --root ${esc(m.root)}`;
      return `<div class="card${(m.refs||[]).length ? '' : ' old'}">
        <div class="name">${esc(m.name)} <span class="meta">@${esc(m.revision.slice(0,12))}</span></div>
        <div class="meta">${esc(m.license||'license unknown')} · ${fmt(m.size)} · ${m.files} files</div>
        <div class="meta"><code>${esc(m.root)}</code></div>
        <div class="badges">${refs}${seed}${att}</div>
        <div class="links"><a href="${esc(m.manifest)}">manifest</a>${m.torrent?` <a href="${esc(m.torrent)}">torrent</a>`:''}${m.reflog?` <a href="${esc(m.reflog)}">ref log</a>`:''} <a href="${magnet}">magnet</a> <span class="meta">${pull}</span></div>
      </div>`;
    }).join('');
  };
  render('');
  document.getElementById('q').addEventListener('input', e => render(e.target.value));
})();
</script>
</body>
</html>
